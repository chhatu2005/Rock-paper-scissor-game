
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <p class="subtitle">Play against the computer</p>

        <div class="score-board">
            <div class="score-card">
                <p>Your Score</p>
                <h2 id="userScore">0</h2>
            </div>

            <div class="score-card">
                <p>Computer Score</p>
                <h2 id="computerScore">0</h2>
            </div>
        </div>

        <h3>Choose Your Move</h3>

        <div class="choices">
            <button class="choice-btn" onclick="playGame('Rock')">
                ✊
                <span>Rock</span>
            </button>

            <button class="choice-btn" onclick="playGame('Paper')">
                ✋
                <span>Paper</span>
            </button>

            <button class="choice-btn" onclick="playGame('Scissors')">
                ✌️
                <span>Scissors</span>
            </button>
        </div>

        <div class="result-box">
            <p id="userChoice">Your choice: -</p>
            <p id="computerChoice">Computer choice: -</p>
            <h2 id="result">Make your first move!</h2>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Score</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
